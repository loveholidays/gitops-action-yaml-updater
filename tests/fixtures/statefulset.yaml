apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: test-statefulset
spec:
  serviceName: test-service
  template:
    spec:
      containers:
        - name: test-app
          image: eu.gcr.io/test/test-app:v1.0.0
          ports:
            - containerPort: 8080
          env:
            - name: ENVIRONMENT
              value: production
